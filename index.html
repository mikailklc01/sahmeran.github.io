<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZovaTech</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background-color: #111; 
            color: #fff;
            padding: 100px 20px; 
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #333;
            padding: 40px;
            border-radius: 12px;
            background: #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #fff; margin-bottom: 10px; font-size: 2.5rem; }
        p { color: #aaa; font-size: 1.1rem; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #007aff;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">YAKINDA</div>
        <h1>ZovaTech</h1>
        <p>MacBook üzerinden, GitHub Pages kullanılarak tamamen ücretsiz ve güvenli bir şekilde oluşturulmuştur.</p>
    </div>
</body>
</html>
